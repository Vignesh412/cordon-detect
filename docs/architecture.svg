<svg viewBox="0 0 640 795" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0B1220"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="795" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#0B1220">cordon-detect: detection pipeline</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#5B6B85">structural veto first — semantic check only when it can't already decide</text>

  <!-- Box 1: trace -->
  <rect x="170" y="70" width="300" height="40" rx="8" fill="#F7F9FC" stroke="#D7DEE9" stroke-width="1.5"/>
  <text x="320" y="95" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#0B1220">agent execution trace</text>

  <line x1="320" y1="110" x2="320" y2="138" stroke="#0B1220" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 2: structural veto -->
  <rect x="120" y="140" width="400" height="75" rx="8" fill="#E4F5F3" stroke="#0E7C72" stroke-width="2"/>
  <text x="320" y="168" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#0E7C72">STRUCTURAL VETO</text>
  <text x="320" y="187" text-anchor="middle" font-size="11" fill="#0B1220">veto.py — declared schema rules</text>
  <text x="320" y="203" text-anchor="middle" font-size="11" fill="#5B6B85">deterministic · ~0.02ms · runs on every trace</text>

  <line x1="320" y1="215" x2="320" y2="243" stroke="#0B1220" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond 1 -->
  <polygon points="320,242 415,280 320,318 225,280" fill="#FFFFFF" stroke="#0B1220" stroke-width="1.5"/>
  <text x="320" y="284" text-anchor="middle" font-size="12" fill="#0B1220">rule violated?</text>

  <!-- YES branch -> blocked (fast) -->
  <line x1="415" y1="280" x2="478" y2="280" stroke="#0B1220" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="447" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#B23A2E">YES</text>
  <rect x="480" y="248" width="140" height="64" rx="8" fill="#FBEAE7" stroke="#B23A2E" stroke-width="2"/>
  <text x="550" y="275" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#B23A2E">BLOCKED</text>
  <text x="550" y="292" text-anchor="middle" font-size="10" fill="#0B1220">semantic check</text>
  <text x="550" y="304" text-anchor="middle" font-size="10" fill="#0B1220">never runs</text>

  <!-- NO branch -> semantic check -->
  <line x1="320" y1="318" x2="320" y2="348" stroke="#0B1220" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="338" y="336" font-size="11" font-weight="700" fill="#5B6B85">NO</text>

  <!-- Box 3: semantic check (optional -> dashed) -->
  <rect x="120" y="350" width="400" height="75" rx="8" fill="#FBF0DF" stroke="#A6650F" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="378" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#A6650F">SEMANTIC CHECK</text>
  <text x="320" y="397" text-anchor="middle" font-size="11" fill="#0B1220">your callback — LLM judge, classifier, rule</text>
  <text x="320" y="413" text-anchor="middle" font-size="11" fill="#5B6B85">optional · only called if structure passed</text>

  <line x1="320" y1="425" x2="320" y2="453" stroke="#0B1220" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond 2 -->
  <polygon points="320,452 415,490 320,528 225,490" fill="#FFFFFF" stroke="#0B1220" stroke-width="1.5"/>
  <text x="320" y="494" text-anchor="middle" font-size="12" fill="#0B1220">flagged?</text>

  <!-- YES branch -> blocked (semantic) -->
  <line x1="415" y1="490" x2="478" y2="490" stroke="#0B1220" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="447" y="482" text-anchor="middle" font-size="11" font-weight="700" fill="#B23A2E">YES</text>
  <rect x="480" y="458" width="140" height="64" rx="8" fill="#FBEAE7" stroke="#B23A2E" stroke-width="2"/>
  <text x="550" y="485" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#B23A2E">BLOCKED</text>
  <text x="550" y="502" text-anchor="middle" font-size="10" fill="#0B1220">flagged by</text>
  <text x="550" y="514" text-anchor="middle" font-size="10" fill="#0B1220">semantic check</text>

  <!-- NO branch -> allowed -->
  <line x1="320" y1="528" x2="320" y2="558" stroke="#0B1220" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="338" y="546" font-size="11" font-weight="700" fill="#5B6B85">NO</text>

  <rect x="210" y="560" width="220" height="50" rx="8" fill="#E7F6EC" stroke="#1D7A45" stroke-width="2"/>
  <text x="320" y="591" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#1D7A45">ALLOWED</text>

  <!-- Legend -->
  <line x1="60" y1="638" x2="580" y2="638" stroke="#D7DEE9" stroke-width="1"/>

  <rect x="60" y="654" width="12" height="12" rx="2" fill="#E4F5F3" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="80" y="664" font-size="11" fill="#0B1220">structural — deterministic, no threshold, checked on every trace</text>

  <rect x="60" y="676" width="12" height="12" rx="2" fill="#FBF0DF" stroke="#A6650F" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="80" y="686" font-size="11" fill="#0B1220">semantic — your callback, only invoked when structure can't decide</text>

  <rect x="60" y="698" width="12" height="12" rx="2" fill="#FBEAE7" stroke="#B23A2E" stroke-width="1.5"/>
  <text x="80" y="708" font-size="11" fill="#0B1220">blocked outcome</text>

  <rect x="60" y="720" width="12" height="12" rx="2" fill="#E7F6EC" stroke="#1D7A45" stroke-width="1.5"/>
  <text x="80" y="730" font-size="11" fill="#0B1220">allowed outcome</text>

  <text x="320" y="756" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#5B6B85">measured (research/trace-experiment): ~50% of traffic resolved by</text>
  <text x="320" y="770" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#5B6B85">structural veto alone — semantic check never invoked</text>
</svg>
