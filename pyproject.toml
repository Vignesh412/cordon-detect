[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cordon-detect"
version = "0.4.0"
description = "Structural anomaly detection and fusion routing for AI agent execution traces"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "Vignesh Iyer"}]
keywords = ["ai-agents", "security", "anomaly-detection", "llm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[tool.setuptools]
packages = ["cordon"]

[project.scripts]
cordon-evaluate = "cordon.evaluate:main"
